name: release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      npm-tag: ${{ steps.channel.outputs.npm-tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version format: $VERSION"
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Release tag ($VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org/'

      - name: Resolve release channel
        id: channel
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CURRENT_LATEST="$(npm view valitype dist-tags.latest)"
          node scripts/release/channel-outputs.mjs "$VERSION" "$CURRENT_LATEST" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build package (ESM + UMD)
        run: |
          npm run build
          npm run build:umd

      - name: Run tests
        run: npm test

      - name: Verify npm package contents
        run: npm pack --dry-run

  publish-npm:
    needs: preflight
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Build package (ESM + UMD)
        run: |
          npm run build
          npm run build:umd

      - name: Publish with provenance and signature
        env:
          NPM_TAG: ${{ needs.preflight.outputs.npm-tag }}
        run: npm publish --access public --tag "$NPM_TAG"
